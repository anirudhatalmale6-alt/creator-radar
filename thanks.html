<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're In! - Creator Radar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:500px;margin:0 auto;padding:40px 20px;text-align:center}
.logo-icon{
  width:80px;height:80px;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle,#0f2a1e,#060e0a);
  border:2px solid #00ff88;box-shadow:0 0 30px rgba(0,255,136,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:#00ff88;position:relative;
}
.check{font-size:40px;color:#00ff88;margin-bottom:16px}
h1{font-size:28px;margin-bottom:12px}
h1 span{color:#00ff88}
p{color:#8aa;font-size:16px;line-height:1.6;margin-bottom:24px}
.back{
  display:inline-block;padding:14px 28px;border-radius:12px;
  background:linear-gradient(135deg,#00ff88,#00b86b);
  color:#031109;font-size:14px;font-weight:900;
  text-decoration:none;text-transform:uppercase;letter-spacing:1px;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo-icon">CR</div>
  <div class="check">&#10003;</div>
  <h1>You're on the <span>list!</span></h1>
  <p>Thanks for signing up for early access to Creator Radar. We'll be in touch when we're ready to onboard our first beta users.</p>
  <p style="font-size:14px">Get ready to stop guessing and start growing.</p>
  <a href="index.html" class="back">Back to Creator Radar</a>
</div>
</body>
</html>
